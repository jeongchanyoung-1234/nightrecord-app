<!doctype html>
<html lang="ko" data-i18n-title-key="auth.signupTitle">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 — 밤의 기록</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css?v=30" />
</head>
<body data-auth="signup">
  <div class="grain"></div>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="./"><span class="brand-mark">◈</span><span data-i18n="brand.name">밤의 기록</span></a>
    </div>
    <div class="topbar-center" aria-hidden="true"></div>
    <nav class="account-nav topbar-right" aria-label="계정">
      <a class="btn btn-ghost" href="login.html" data-i18n="nav.login">로그인</a>
    </nav>
  </header>
  <main>
    <section class="auth-page">
      <p class="eyebrow">ACCOUNT</p>
      <h1 data-i18n="auth.signupTitle">회원가입</h1>
      <p class="lede" data-i18n="auth.signupLede">아이디와 비밀번호로 바로 가입합니다. 비밀번호는 8자 이상입니다.</p>
      <form id="accountForm" class="auth-form">
        <label><span data-i18n="auth.username">아이디</span> <input id="loginEmail" type="text" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" placeholder="nightfarer" /></label>
        <label><span data-i18n="auth.password">비밀번호</span> <input id="loginPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72" /></label>
        <label><span data-i18n="auth.passwordConfirm">비밀번호 확인</span> <input id="loginPasswordConfirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72" /></label>
        <button id="authSubmit" class="btn btn-solid" type="submit" data-i18n="auth.submitSignup">가입하기</button>
      </form>
      <p id="alreadyIn" hidden><a class="btn btn-solid" href="./" data-i18n="auth.toRecords">기록 페이지로</a></p>
      <p id="accountMessage" class="muted" role="status" aria-live="polite"></p>
      <p class="auth-links"><a href="login.html" data-i18n="auth.hasAccount">이미 계정이 있나요?</a></p>
      <p class="account-privacy" data-i18n="auth.privacy">세이브 원본과 Steam ID는 전송하지 않습니다.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-main">
      <span data-i18n="footer.brand">밤의 기록 · NIGHTREIGN SAVE ANALYZER</span>
      <span class="muted" data-i18n="footer.privacy">세이브는 브라우저에서만 처리됩니다.</span>
    </div>
    <div class="footer-links">
      <a href="mailto:jcy19960721@gmail.com" data-i18n="footer.contact">문의</a>
      <a href="https://github.com/sponsors/jeongchanyoung-1234" target="_blank" rel="noopener noreferrer" data-i18n="footer.sponsor">개발자에게 커피 한 잔</a>
      <div class="lang-switch" data-lang-switch></div>
    </div>
  </footer>

  <script type="module" src="assets/auth-pages.js?v=4"></script>
</body>
</html>
