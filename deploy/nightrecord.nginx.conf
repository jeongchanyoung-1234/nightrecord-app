# nightrecord.app -> 이 서버의 밤의 기록 (127.0.0.1:8080)
# Cloudflare 프록시 사용 시 SSL 모드는 Full(strict) 권장.
# X-Forwarded-For는 클라이언트 값을 잇지 않고 접속 IP만 넣는다.

upstream nightrecord_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name nightrecord.app www.nightrecord.app dev.nightrecord.app nightrecord.duckdns.org;

    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nightrecord.app www.nightrecord.app;

    client_max_body_size 2m;

    # certbot이 아래 인증서 경로를 채우거나 갱신합니다.
    ssl_certificate /etc/letsencrypt/live/nightrecord.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightrecord.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://nightrecord_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 개발/관리용 서브도메인 (같은 앱). 인증서는 nightrecord.app과 함께 발급하거나 별도 SAN.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.nightrecord.app;

    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/nightrecord.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightrecord.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://nightrecord_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 옛 DuckDNS 주소는 새 도메인으로 보냅니다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nightrecord.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/nightrecord.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightrecord.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nightrecord.app$request_uri;
}
